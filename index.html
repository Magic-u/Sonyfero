<head>
<meta charset="UTF-8">

<title>SONOFERO | Links</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Creepster&family=Special+Elite&display=swap');
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#080707;color:#e8e1db}
body{font-family:"Special Elite",monospace;min-height:100vh;background:radial-gradient(circle at 50% 12%,rgba(120,20,50,.16),transparent 30%),#080707}
.page{width:min(100%,500px);margin:auto;padding:14px 14px 35px}
.hero{position:relative;overflow:hidden;background:#0d0c0c;border:1px solid #8f244855;box-shadow:0 0 30px rgba(90,15,40,.2)}
.hero img{display:block;width:100%;height:auto;filter:grayscale(1) contrast(1.1) brightness(.92)}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 58%,rgba(8,7,7,.9));pointer-events:none}
.title{position:absolute;z-index:2;right:16px;bottom:15px;text-align:right;color:#a5264d;font:43px/.83 Creepster,cursive;text-shadow:2px 2px #050404}
.subtitle{margin:13px 0 18px;text-align:center;color:#a39a94;font-size:10px;letter-spacing:2px;text-transform:uppercase}
.links{display:grid;gap:12px}
.link{display:grid;grid-template-columns:46px 1fr 25px;align-items:center;min-height:73px;padding:8px 14px;color:#e8e1db;text-decoration:none;background:linear-gradient(90deg,rgba(109,24,50,.28),transparent 35%),rgba(8,7,7,.95);border:1px solid rgba(165,38,77,.7);outline:1px solid rgba(109,24,50,.22);box-shadow:0 7px 22px rgba(0,0,0,.32)}
.link:hover{border-color:#c13a62;background:linear-gradient(90deg,rgba(130,25,55,.38),transparent 40%),rgba(13,9,10,.98)}
.icon{width:33px;height:33px;display:grid;place-items:center;border:1px solid #e8e1db66;background:rgba(109,24,50,.25);font-size:17px;transform:rotate(-4deg)}
.name{font-family:Creepster,cursive;font-size:27px;letter-spacing:1px}
.desc{display:block;color:#a59b95;font-size:9px;letter-spacing:1.4px;text-transform:uppercase;margin-top:1px}
.arrow{color:#a5264d;font-size:25px}
.disabled{opacity:.72;cursor:default}
.disabled:hover{border-color:rgba(165,38,77,.7);background:linear-gradient(90deg,rgba(109,24,50,.28),transparent 35%),rgba(8,7,7,.95)}
.footer{margin-top:21px;text-align:center;color:#68615d;font-size:9px;letter-spacing:2px}
.cross{color:#a5264d;font-size:22px}
@media(max-width:430px){.page{padding:10px}.title{font-size:34px}.link{min-height:68px}}
</style>
</head>
